name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        shell: pwsh
        run: |
          cargo test --workspace --locked --no-fail-fast 2>&1 | Tee-Object -FilePath test-output.txt
          $code = $LASTEXITCODE
          # Failing tests and panics as annotations (readable through the API).
          Select-String -Path test-output.txt -Pattern 'FAILED|panicked|^error|could not compile|STATUS_|exit code' |
            Select-Object -First 40 | ForEach-Object { Write-Output "::error::$($_.Line)" }
          exit $code
